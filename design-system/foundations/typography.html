<!-- @dsCard group="Foundations" name="Typography" subtitle="Shippori Mincho / DM Sans / Cormorant" -->
<!doctype html>
<html lang="ja"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../_brand.css"/>
<style>
  .row { padding: 22px 26px; border-bottom: 1px solid var(--lp-paper-line); }
  .row:last-child { border: 0; }
  .tag { font-size: 12px; letter-spacing:.18em; text-transform: uppercase; color: var(--lp-terracotta); font-weight: 600; margin-bottom: 8px; }
  .spec { font-size: 12px; color: var(--lp-ink-mute); margin-top: 6px; }
</style></head>
<body><div class="ds-stage">
  <div class="ds-kicker">Foundations</div>
  <h2 class="ds-h2">タイポグラフィ</h2>
  <div class="lp-glass" style="overflow:hidden">
    <div class="row">
      <div class="tag">Display — Cormorant Garamond Italic</div>
      <div style="font-family:var(--display);font-style:italic;font-size:52px;color:var(--lp-ink)">Okuri-kotoba</div>
      <div class="spec">英字の装飾見出し・カードの署名に使用</div>
    </div>
    <div class="row">
      <div class="tag">Heading — Shippori Mincho 600</div>
      <div style="font-family:var(--serif);font-weight:600;font-size:40px">想いを、贈ることばに。</div>
      <div class="spec">H1/H2・セクション見出し。font-feature "palt"</div>
    </div>
    <div class="row">
      <div class="tag">Body — DM Sans 400/500</div>
      <div style="font-family:var(--sans);font-size:19px;line-height:1.7;max-width:620px">デザインのセンスがなくても、3分で感動的なメッセージカードが作れる。シーンを選んで、言葉を添えるだけ。</div>
      <div class="spec">本文・UIラベル・ボタン</div>
    </div>
  </div>
</div></body></html>
