<!-- @dsCard group="Foundations" name="Color palette" subtitle="紺 × 生成り × 朱 × 金" -->
<!doctype html>
<html lang="ja"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../_brand.css"/>
<style>
  .sw-grid { grid-template-columns: repeat(4, 1fr); }
  .sw { border-radius: 16px; overflow: hidden; box-shadow: var(--lp-shadow-card); background:#fff; }
  .sw .chip { height: 120px; }
  .sw .meta { padding: 14px 16px; }
  .sw .nm { font-family: var(--serif); font-weight: 600; font-size: 17px; }
  .sw .hex { font-family: var(--sans); font-size: 13px; color: var(--lp-ink-soft); letter-spacing:.04em; }
</style></head>
<body><div class="ds-stage">
  <div class="ds-kicker">Foundations</div>
  <h2 class="ds-h2">カラーパレット</h2>
  <div class="ds-grid sw-grid">
    <div class="sw"><div class="chip" style="background:#1A2744"></div><div class="meta"><div class="nm">Ink 紺</div><div class="hex">#1A2744 · primary</div></div></div>
    <div class="sw"><div class="chip" style="background:#F4F0E6"></div><div class="meta"><div class="nm">Cream 生成り</div><div class="hex">#F4F0E6 · surface</div></div></div>
    <div class="sw"><div class="chip" style="background:#B03A2E"></div><div class="meta"><div class="nm">Vermilion 朱</div><div class="hex">#B03A2E · accent</div></div></div>
    <div class="sw"><div class="chip" style="background:#B89968"></div><div class="meta"><div class="nm">Gold 金</div><div class="hex">#B89968 · detail</div></div></div>
    <div class="sw"><div class="chip" style="background:#0D1430"></div><div class="meta"><div class="nm">Night</div><div class="hex">#0D1430 · hero bg</div></div></div>
    <div class="sw"><div class="chip" style="background:#26345A"></div><div class="meta"><div class="nm">Ink 2</div><div class="hex">#26345A</div></div></div>
    <div class="sw"><div class="chip" style="background:#8AA676"></div><div class="meta"><div class="nm">Sage</div><div class="hex">#8AA676 · botanical</div></div></div>
    <div class="sw"><div class="chip" style="background:#FAF7EF"></div><div class="meta"><div class="nm">Paper</div><div class="hex">#FAF7EF · card</div></div></div>
  </div>
</div></body></html>
