<!-- @dsCard group="Patterns" name="Depth hero" subtitle="紺の奥行き → 明るい着地・水引一本線" -->
<!doctype html>
<html lang="ja"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../_brand.css"/>
<style>
  .hero { position:relative; min-height:560px; border-radius:24px; overflow:hidden;
    display:flex; align-items:center; justify-content:center; text-align:center;
    background: radial-gradient(120% 80% at 50% 40%, #26345A 0%, #1A2744 45%, #0D1430 100%);
    box-shadow: var(--lp-shadow-deep); }
  .hero .glow { position:absolute; inset:0; background: radial-gradient(50% 40% at 50% 30%, rgba(184,153,104,0.18), transparent 70%); }
  .htitle { font-family:var(--serif); font-weight:600; font-size:52px; line-height:1.35; color:var(--lp-cream-soft); position:relative; }
  .hsub { font-family:var(--sans); font-size:17px; color:rgba(244,240,230,0.74); margin:18px 0 28px; position:relative; }
  .hcta { display:flex; gap:14px; justify-content:center; position:relative; }
  .ribbon { position:absolute; right:8%; top:0; bottom:0; width:80px; }
  .ribbon path { stroke-linecap:round; fill:none; stroke-width:5; }
</style></head>
<body><div class="ds-stage" style="padding:40px">
  <div class="hero">
    <div class="glow"></div>
    <svg class="ribbon" viewBox="0 0 100 560" preserveAspectRatio="none">
      <path d="M50 0 C 80 140, 20 280, 50 420 C 70 500, 40 540, 50 560" stroke="#B89968"/>
      <path d="M50 0 C 80 140, 20 280, 50 420" stroke="#B03A2E" stroke-dasharray="6 14"/>
    </svg>
    <div>
      <div class="htitle">想いを、<br/>贈ることばに。</div>
      <div class="hsub">デザインのセンスがなくても、3分で。</div>
      <div class="hcta">
        <button class="lp-btn lp-btn--primary">無料でカードを作る</button>
        <button class="lp-btn lp-btn--ghost" style="color:var(--lp-cream-soft);border-color:rgba(244,240,230,0.62)">ギャラリー</button>
      </div>
    </div>
  </div>
</div></body></html>
