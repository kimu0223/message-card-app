<!-- @dsCard group="Components" name="Logo / Hanko mark" subtitle="贈 印・横組みロックアップ" -->
<!doctype html>
<html lang="ja"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../_brand.css"/>
<style>
  .lockup { display:flex; align-items:center; gap:16px; }
  .wordmark { font-family: var(--serif); font-weight: 600; font-size: 30px; letter-spacing:.04em; color: var(--lp-ink); }
  .panel { display:flex; gap:48px; align-items:center; flex-wrap:wrap; }
  .onink { background: var(--lp-night); padding: 40px 48px; border-radius: 20px; }
  .onink .wordmark, .onink .sub { color: var(--lp-cream-soft); }
  .onink .lp-logo-icon { background: var(--lp-cream-soft); color: var(--lp-ink); }
  .sub { font-size: 13px; color: var(--lp-ink-soft); margin-top: 4px; letter-spacing:.16em; text-transform: uppercase; }
</style></head>
<body><div class="ds-stage">
  <div class="ds-kicker">Components</div>
  <h2 class="ds-h2">ロゴ — 贈の印（はんこ）</h2>
  <div class="panel">
    <div class="lp-glass" style="padding:40px 48px">
      <div class="lockup">
        <span class="lp-logo-icon">贈</span>
        <div><div class="wordmark">贈りことば</div><div class="sub">Okuri-kotoba</div></div>
      </div>
    </div>
    <div class="onink">
      <div class="lockup">
        <span class="lp-logo-icon">贈</span>
        <div><div class="wordmark">贈りことば</div><div class="sub">on night</div></div>
      </div>
    </div>
  </div>
</div></body></html>
