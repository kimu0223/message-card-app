<!-- @dsCard group="Components" name="Glass cards & SectionHead" subtitle="ガラスカード・見出し・特徴ブロック" -->
<!doctype html>
<html lang="ja"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../_brand.css"/>
<style>
  .cards { grid-template-columns: repeat(3, 1fr); }
  .card { padding: 28px 26px; }
  .ic { width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:22px;
    background:rgba(176,58,46,0.10);color:var(--lp-terracotta);margin-bottom:16px; }
  .ct { font-family:var(--serif);font-weight:600;font-size:20px;margin-bottom:8px; }
  .cb { font-size:14.5px;line-height:1.65;color:var(--lp-ink-soft); }
</style></head>
<body><div class="ds-stage">
  <div class="ds-kicker">Components</div>
  <h2 class="ds-h2">ガラスカード</h2>
  <div class="ds-grid cards">
    <div class="lp-glass card"><div class="ic">✍️</div><div class="ct">シーンを選ぶだけ</div><div class="cb">誕生日・お礼・送別。30以上のシーンから選んで言葉を添えるだけ。</div></div>
    <div class="lp-glass card"><div class="ic">✨</div><div class="ct">AIが言葉を提案</div><div class="cb">伝えたい想いを入れると、4パターンのデザインと文面を提案します。</div></div>
    <div class="lp-glass card"><div class="ic">📮</div><div class="ct">LINEで送るだけ</div><div class="cb">完成したカードはURLひとつ。LINEで送れば、そっと手紙が開きます。</div></div>
  </div>
</div></body></html>
